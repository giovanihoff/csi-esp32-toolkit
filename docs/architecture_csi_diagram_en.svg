<svg width="1100" height="490" viewBox="0 0 1100 490" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ESP32 C3 Icon -->
  <g>
    <rect x="70" y="170" width="100" height="100" rx="14" fill="#fff" stroke="#222" stroke-width="4"/>
    <!-- Pins -->
    <g stroke="#222" stroke-width="3">
      <line x1="64" y1="182" x2="70" y2="182"/>
      <line x1="64" y1="198" x2="70" y2="198"/>
      <line x1="64" y1="214" x2="70" y2="214"/>
      <line x1="64" y1="230" x2="70" y2="230"/>
      <line x1="64" y1="246" x2="70" y2="246"/>
      <line x1="64" y1="262" x2="70" y2="262"/>
      <line x1="170" y1="182" x2="176" y2="182"/>
      <line x1="170" y1="198" x2="176" y2="198"/>
      <line x1="170" y1="214" x2="176" y2="214"/>
      <line x1="170" y1="230" x2="176" y2="230"/>
      <line x1="170" y1="246" x2="176" y2="246"/>
      <line x1="170" y1="262" x2="176" y2="262"/>
    </g>
  </g>
  <text x="120" y="300" font-size="23" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle" font-weight="bold">ESP32 C3</text>
  <text x="120" y="323" font-size="18" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle">Transmitter</text>

  <!-- ESP32 DEVKIT V1 Icon -->
  <g>
    <rect x="930" y="170" width="100" height="100" rx="14" fill="#fff" stroke="#222" stroke-width="4"/>
    <g stroke="#222" stroke-width="3">
      <line x1="1030" y1="182" x2="1036" y2="182"/>
      <line x1="1030" y1="198" x2="1036" y2="198"/>
      <line x1="1030" y1="214" x2="1036" y2="214"/>
      <line x1="1030" y1="230" x2="1036" y2="230"/>
      <line x1="1030" y1="246" x2="1036" y2="246"/>
      <line x1="1030" y1="262" x2="1036" y2="262"/>
      <line x1="930" y1="182" x2="924" y2="182"/>
      <line x1="930" y1="198" x2="924" y2="198"/>
      <line x1="930" y1="214" x2="924" y2="214"/>
      <line x1="930" y1="230" x2="924" y2="230"/>
      <line x1="930" y1="246" x2="924" y2="246"/>
      <line x1="930" y1="262" x2="924" y2="262"/>
    </g>
  </g>
  <text x="980" y="295" font-size="23" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="980" y="320" font-size="20" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle" font-weight="bold">DEVKIT V1</text>
  <text x="980" y="343" font-size="18" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle">Receiver</text>

  <!-- User Icon: Realistic bust (profile, white, outlined, Google Material style) -->
  <g>
    <!-- Shoulders and bust -->
    <ellipse cx="550" cy="270" rx="48" ry="32" fill="#fff" stroke="#222" stroke-width="5"/>
    <!-- Neck -->
    <rect x="530" y="240" width="40" height="28" rx="13" fill="#fff" stroke="#222" stroke-width="5"/>
    <!-- Head (with chin/face outline) -->
    <ellipse cx="550" cy="218" rx="30" ry="35" fill="#fff" stroke="#222" stroke-width="5"/>
    <!-- Chin line -->
    <path d="M535 240 Q550 252 565 240" stroke="#888" stroke-width="2.5" fill="none"/>
    <!-- Face shadow -->
    <ellipse cx="550" cy="228" rx="15" ry="5" fill="#eee"/>
  </g>
  <text x="550" y="340" font-size="27" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle" font-weight="bold">User</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="3.5" orient="auto">
      <polygon points="0 0, 11 3.5, 0 7" fill="#222" />
    </marker>
  </defs>
  <!-- Wi-Fi Frames Arrow -->
  <line x1="170" y1="220" x2="480" y2="220" stroke="#222" stroke-width="3.5" marker-end="url(#arrowhead)"/>
  <!-- CSI Arrow -->
  <line x1="620" y1="220" x2="930" y2="220" stroke="#222" stroke-width="3.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow Texts: Ampla distância dos ícones, centralizados -->
  <text x="325" y="200" font-size="20" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle">Wi-Fi Frames</text>
  <text x="775" y="200" font-size="20" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle">Wireless Channel (CSI)</text>

  <!-- Environmental Noise: movido para a esquerda -->
  <g>
    <path d="M870 95 Q880 80 890 95 Q900 110 910 95" stroke="#222" stroke-width="3" fill="none"/>
    <path d="M870 115 Q880 100 890 115 Q900 130 910 115" stroke="#222" stroke-width="3" fill="none"/>
    <text x="915" y="99" font-size="18" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="start">Environmental</text>
    <text x="915" y="119" font-size="18" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="start">Noise</text>
  </g>

  <!-- Controlled Environment -->
  <text x="550" y="455" font-size="30" font-family="Arial" fill="#fff" stroke="#222" stroke-width="2" paint-order="stroke fill" text-anchor="middle">Controlled Environment</text>
</svg>

